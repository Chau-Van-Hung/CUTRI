<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thông Tin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#000814;
    font-family:Arial;
    overflow:hidden;
}

.container{
    width:100vw;
    height:100vh;
    display:flex;
}

.left{
    width:33%;
    background:#001d3d;
    display:flex;
    justify-content:center;
    align-items:center;
}

.left img{
    max-width:85%;
    max-height:85%;
    border:6px solid white;
    box-shadow:0 0 25px #00b4d8;
    transition: transform 20s linear, opacity 0.5s ease;
}

.right{
    width:67%;
    position:relative;
    overflow:hidden;
    padding-left:60px;
}

.scroll{
    position:absolute;
    width:85%;
    top:50%;
    transform:translateY(-50%);
}

@keyframes scrollUp{
    0%{
        transform:translateY(-50%);
    }
    100%{
        transform:translateY(-150%);
    }
}

.info{
    font-size:36px;
    line-height:70px;
    font-weight:bold;
    color:#ffd60a;
    text-shadow:0 0 15px #ffc300;
}

@media (max-width: 768px){
    .info{
        font-size:28px;
        line-height:55px;
    }
}

.label{
    color:#ffd60a;
}

.value{
    color:#00b4d8;
}

</style>
</head>

<body>

<div class="container">

    <div class="left">
        <img id="photo" src="">
    </div>

    <div class="right">
        <div class="scroll" id="scroll">
            <div class="info" id="data">
                ĐANG TẢI...
            </div>
        </div>
    </div>

</div>

<script>

let currentIndex = 0;
let people = [];
let duration = 30000; // 30 giây mỗi người

fetch("thongtin.txt?v=" + Date.now())
.then(res => res.text())
.then(text => {

    people = text.split("===").filter(b => b.trim() !== "");
    showPerson(currentIndex);

});

function showPerson(index){

    const lines = people[index].trim().split("\n");
    let image = "";
    let content = "";

    lines.forEach(line=>{
        if(line.startsWith("anh:")){
            image = line.replace("anh:","").trim();
        } else if(line.includes(":")){
            const parts = line.split(":");
            content += "<span class='label'>" + parts[0] + ":</span> " +
                       "<span class='value'>" + parts.slice(1).join(":") + "</span><br>";
        }
    });

    const img = document.getElementById("photo");
    const scrollDiv = document.getElementById("scroll");

    // Fade ảnh
    img.style.opacity = 0;

    setTimeout(()=>{
        img.src = image + "?v=" + Date.now();
        img.style.opacity = 1;

        // Zoom nhẹ
        img.style.transform = "scale(1.08)";
    },300);

    // Reset zoom
    setTimeout(()=>{
        img.style.transform = "scale(1)";
    }, duration);

    document.getElementById("data").innerHTML = content;

    // Reset animation chữ
    scrollDiv.style.animation = "none";
    scrollDiv.offsetHeight;
    scrollDiv.style.animation = `scrollUp ${duration/1000}s linear`;

    // Chuyển người sau khi chạy xong
