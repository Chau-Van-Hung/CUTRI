<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thông Tin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:url("anhnen.jpg") no-repeat center center fixed;
    background-size:cover;
    font-family:Segoe UI, Arial, sans-serif;
    overflow:hidden;
}

/* làm nền tối */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

.container{
    width:100vw;
    height:100vh;
    display:flex;
}

/* CỘT ẢNH */

.left{
    width:34%;
    background:#001d3d;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* KHUNG ẢNH CHUẨN */

.left img{

    width:450px;
    height:600px;

    object-fit:cover;

    border:6px solid white;

    box-shadow:0 0 35px #00b4d8;

    opacity:0;

    transform:scale(1);

    transition:
        opacity 0.9s ease,
        transform 18s linear;

}

/* CỘT CHỮ */

.right{

    width:66%;

    position:relative;

    overflow:hidden;

    padding-left:60px;

}

.scroll{

    position:absolute;

    width:85%;

    top:50%;

    transform:translateY(-50%);

}

@keyframes scrollUp{

    0%{
        transform:translateY(100%);
    }

    100%{
        transform:translateY(-150%);
    }

}

/* NỘI DUNG */

.info{

    font-size:38px;

    line-height:72px;

    font-weight:bold;

    letter-spacing:1px;

    text-shadow:0 0 15px rgba(255,255,255,0.25);

}

.label{

    color:white;

}

.value{

    color:#3ea6ff;

}

/* mobile */

@media (max-width:768px){

.info{

    font-size:28px;

    line-height:55px;

}

}

</style>
</head>

<body>

<div class="container">

<div class="left">
<img id="photo">
</div>

<div class="right">

<div class="scroll" id="scroll">

<div class="info" id="data">
ĐANG TẢI...
</div>

</div>

</div>

</div>

<script>

let currentIndex = 0;

let people = [];

let duration = 15000;

fetch("thongtin.txt?v=" + Date.now())

.then(res=>res.text())

.then(text=>{

people = text.split("===")
.filter(p=>p.trim()!="");

showPerson(0);

});

function showPerson(index){

const lines = people[index].trim().split("\n");

let image="";

let content="";

lines.forEach(line=>{

if(line.startsWith("anh:")){

image=line.replace("anh:","").trim();

}

else if(line.includes(":")){

let parts=line.split(":");

content+=
"<span class='label'>"+parts[0]+":</span> "+
"<span class='value'>"+parts.slice(1).join(":")+"</span><br>";

}

});

const img=document.getElementById("photo");

const scrollDiv=document.getElementById("scroll");

document.getElementById("data").innerHTML=content;

/* LOAD ẢNH TRƯỚC */

let newImg=new Image();

newImg.src=image+"?v="+Date.now();

newImg.onload=function(){

img.style.opacity=0;

setTimeout(()=>{

img.src=newImg.src;

img.style.transform="scale(1.06)";

img.style.opacity=1;

},300);

};

/* zoom chậm */

setTimeout(()=>{

img.style.transform="scale(1)";

},duration);

/* chữ chạy */

scrollDiv.style.animation="none";

scrollDiv.offsetHeight;

scrollDiv.style.animation="scrollUp "+(duration/1000)+"s linear";

/* chuyển người */

setTimeout(()=>{

currentIndex++;

if(currentIndex>=people.length){
currentIndex=0;
}

showPerson(currentIndex);

},duration);

}

</script>

</body>
</html>
